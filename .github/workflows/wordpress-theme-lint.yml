name: WordPress theme syntax

on:
  pull_request:
    paths:
      - "wordpress/**"
      - ".github/workflows/wordpress-theme-lint.yml"
  push:
    branches:
      - "migration/wordpress-theme"
    paths:
      - "wordpress/**"
      - ".github/workflows/wordpress-theme-lint.yml"

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
      - name: Lint theme and migration scripts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t php_files < <(find wordpress -type f -name '*.php' -print)
          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "No PHP files found under wordpress/"
            exit 1
          fi
          for file in "${php_files[@]}"; do
            echo "Linting $file"
            php -l "$file"
          done
